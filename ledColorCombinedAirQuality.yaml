blueprint:
  name: Combined Air Quality Status LED (Apollo Air-1)
  domain: automation

  input:
    co_sensor:
      name: CO Sensor
      description: Select the respective carbon monoxide sensor
      default: null
      selector:
        entity:
          domain: sensor
    co2_sensor:
      name: CO2 Sensor
      description: Select the respective carbon dioxide sensor
      default: null
      selector:
        entity:
          domain: sensor
    pm_sensor:
      name: PM Sensor
      description: Select the respective particulate matter sensor (recommended PM <10µm)
      default: null
      selector:
        entity:
          domain: sensor
    voc_sensor:
      name: VOC Index Sensor
      description: Select the respective numeric volatile organic compound index sensor.
      default: null
      selector:
        entity:
          domain: sensor
    aqi_sensor:
      name: AQI Index Sensor
      description: Select the respective air quality index sensor (e.g. NowCast AQI).
      default: null
      selector:
        entity:
          domain: sensor
    auxiliary_sensor:
      name: Auxiliary Sensor
      description: Optional additional sensor for a custom air-quality signal.
      default: null
      selector:
        entity:
          domain: sensor
    led_light:
      name: LED Light
      description: Select the LED that shall be used as indicator
      selector:
        entity:
          domain: light

    update_delay:
      name: Update delay (anti-flicker)
      description: Delay after a sensor change before updating the LED
      default: "00:01:00"
      selector:
        duration:

    day_brightness:
      name: Day Brightness
      description: LED brightness during daytime (1–255). Values below ~35 may affect perceived color
      default: 128
      selector:
        number:
          min: 0
          max: 255

    night_brightness:
      name: Night Brightness
      description: LED brightness during night time (1–255). Set to 0 to turn LED off at night
      default: 35
      selector:
        number:
          min: 0
          max: 255

    night_start:
      name: Night Start Time
      description: Time when night brightness becomes active
      default: "22:00:00"
      selector:
        time:

    night_end:
      name: Night End Time
      description: Time when day brightness becomes active
      default: "08:00:00"
      selector:
        time:

    color_stage_1:
      name: Stage 1 Color
      description: Color when all values are below stage 2 thresholds
      default: [0, 0, 255]
      selector:
        color_rgb:

    color_stage_2:
      name: Stage 2 Color
      description: Color when any value exceeds stage 2 thresholds
      default: [255, 200, 0]
      selector:
        color_rgb:

    color_stage_3:
      name: Stage 3 Color
      description: Color when any value exceeds stage 3 thresholds
      default: [255, 0, 0]
      selector:
        color_rgb:

    co_stage_2:
      name: CO Stage 2 Threshold
      description: CO level where stage 2 is triggered
      default: 5
      selector:
        number:
          min: 0
          max: 50
    co_stage_3:
      name: CO Stage 3 Threshold
      description: CO level where stage 3 is triggered
      default: 10
      selector:
        number:
          min: 0
          max: 100

    co2_stage_2:
      name: CO2 Stage 2 Threshold
      description: CO2 level where stage 2 is triggered
      default: 1000
      selector:
        number:
          min: 0
          max: 2000
    co2_stage_3:
      name: CO2 Stage 3 Threshold
      description: CO2 level where stage 3 is triggered
      default: 2000
      selector:
        number:
          min: 0
          max: 4000

    pm_stage_2:
      name: PM Stage 2 Threshold
      description: Particulate level where stage 2 is triggered
      default: 100
      selector:
        number:
          min: 0
          max: 400
    pm_stage_3:
      name: PM Stage 3 Threshold
      description: Particulate level where stage 3 is triggered
      default: 400
      selector:
        number:
          min: 0
          max: 2000

    voc_stage_2:
      name: VOC Index Stage 2 Threshold
      description: VOC Index level where stage 2 is triggered
      default: 120
      selector:
        number:
          min: 0
          max: 500
    voc_stage_3:
      name: VOC Index Stage 3 Threshold
      description: VOC level where stage 3 is triggered
      default: 250
      selector:
        number:
          min: 0
          max: 500
    aqi_stage_2:
      name: AQI Stage 2 Threshold
      description: AQI level where stage 2 is triggered
      default: 100
      selector:
        number:
          min: 0
          max: 300
    aqi_stage_3:
      name: AQI Stage 3 Threshold
      description: AQI level where stage 3 is triggered
      default: 200
      selector:
        number:
          min: 0
          max: 300

    auxiliary_stage_2:
      name: Auxiliary Stage 2 Threshold
      description: Auxiliary sensor level where stage 2 is triggered
      default: 90
      selector:
        number:
          min: 0
          max: 100
    auxiliary_stage_3:
      name: Auxiliary Stage 3 Threshold
      description: Auxiliary sensor level where stage 3 is triggered
      default: 95
      selector:
        number:
          min: 0
          max: 100

mode: single

trigger:
  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input co_sensor

  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input co2_sensor

  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input pm_sensor

  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input voc_sensor

  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input aqi_sensor

  - platform: event
    event_type: state_changed
    event_data:
      entity_id: !input auxiliary_sensor

  - platform: time
    at: !input night_start

  - platform: time
    at: !input night_end

  - platform: homeassistant
    event: start

variables:
  co_entity: !input co_sensor
  co2_entity: !input co2_sensor
  pm_entity: !input pm_sensor
  voc_entity: !input voc_sensor
  aqi_entity: !input aqi_sensor
  auxiliary_entity: !input auxiliary_sensor

  co_stage_2_input: !input co_stage_2
  co_stage_3_input: !input co_stage_3
  co2_stage_2_input: !input co2_stage_2
  co2_stage_3_input: !input co2_stage_3
  pm_stage_2_input: !input pm_stage_2
  pm_stage_3_input: !input pm_stage_3
  voc_stage_2_input: !input voc_stage_2
  voc_stage_3_input: !input voc_stage_3
  aqi_stage_2_input: !input aqi_stage_2
  aqi_stage_3_input: !input aqi_stage_3
  auxiliary_stage_2_input: !input auxiliary_stage_2
  auxiliary_stage_3_input: !input auxiliary_stage_3

  co_stage_2: >
    {% if co_entity %}
      {{ co_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  co_stage_3: >
    {% if co_entity %}
      {{ co_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}
  co2_stage_2: >
    {% if co2_entity %}
      {{ co2_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  co2_stage_3: >
    {% if co2_entity %}
      {{ co2_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}
  pm_stage_2: >
    {% if pm_entity %}
      {{ pm_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  pm_stage_3: >
    {% if pm_entity %}
      {{ pm_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}
  voc_stage_2: >
    {% if voc_entity %}
      {{ voc_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  voc_stage_3: >
    {% if voc_entity %}
      {{ voc_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}
  aqi_stage_2: >
    {% if aqi_entity %}
      {{ aqi_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  aqi_stage_3: >
    {% if aqi_entity %}
      {{ aqi_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}
  auxiliary_stage_2: >
    {% if auxiliary_entity %}
      {{ auxiliary_stage_2_input | float(0) }}
    {% else %}
      0
    {% endif %}
  auxiliary_stage_3: >
    {% if auxiliary_entity %}
      {{ auxiliary_stage_3_input | float(0) }}
    {% else %}
      0
    {% endif %}

  color_stage_1: !input color_stage_1
  color_stage_2: !input color_stage_2
  color_stage_3: !input color_stage_3

  day_brightness: !input day_brightness
  night_brightness: !input night_brightness
  night_start: !input night_start
  night_end: !input night_end

action:
  - if:
      - condition: template
        value_template: "{{ trigger.platform == 'event' }}"
    then:
      - delay: !input update_delay

  - variables:
      co: >
        {% if co_entity %}
          {{ states(co_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      co2: >
        {% if co2_entity %}
          {{ states(co2_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      pm: >
        {% if pm_entity %}
          {{ states(pm_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      voc: >
        {% if voc_entity %}
          {{ states(voc_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      aqi: >
        {% if aqi_entity %}
          {{ states(aqi_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      auxiliary: >
        {% if auxiliary_entity %}
          {{ states(auxiliary_entity) | float(0) }}
        {% else %}
          0
        {% endif %}

  - variables:
      brightness: >
        {% set current = now().time() %}
        {% set start = strptime(night_start, "%H:%M:%S").time() %}
        {% set end = strptime(night_end, "%H:%M:%S").time() %}
        {% if start < end %}
          {% set is_night = start <= current < end %}
        {% else %}
          {% set is_night = current >= start or current < end %}
        {% endif %}
        {{ night_brightness if is_night else day_brightness }}
      state_level: >
        {% set stage_3 =
          co > co_stage_3 or
          co2 > co2_stage_3 or
          pm > pm_stage_3 or
          voc > voc_stage_3 or
          aqi > aqi_stage_3 or
          auxiliary > auxiliary_stage_3
        %}
        {% set stage_2 =
          co > co_stage_2 or
          co2 > co2_stage_2 or
          pm > pm_stage_2 or
          voc > voc_stage_2 or
          aqi > aqi_stage_2 or
          auxiliary > auxiliary_stage_2
        %}
        {% if stage_3 %}
          stage_3
        {% elif stage_2 %}
          stage_2
        {% else %}
          stage_1
        {% endif %}

  - choose:
      #Turn off LED if brightness is 0
      - conditions: "{{ brightness | int == 0 }}"
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input led_light

      #Stage 1
      - conditions: "{{ state_level == 'stage_1' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input led_light
            data:
              rgb_color: "{{ color_stage_1 }}"
              brightness: "{{ brightness | int }}"

      #Stage 2
      - conditions: "{{ state_level == 'stage_2' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input led_light
            data:
              rgb_color: "{{ color_stage_2 }}"
              brightness: "{{ brightness | int }}"

      #Stage 3
      - conditions: "{{ state_level == 'stage_3' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input led_light
            data:
              rgb_color: "{{ color_stage_3 }}"
              brightness: "{{ brightness | int }}"
